<article class="recipe-card" data-recipe-card data-search-text="{{ recipe.name }} {% for ingredient in recipe.ingredients %}{{ ingredient.name }} {% endfor %}">
    <form class="favorite-form" method="post" action="{{ url_for('toggle_favorite', recipe_id=recipe.id) }}">
        <button type="submit" class="favorite-button{% if recipe.id in favorite_ids %} is-favorite{% endif %}" aria-pressed="{{ 'true' if recipe.id in favorite_ids else 'false' }}">
            {% if recipe.id in favorite_ids %}♥ Favorited{% else %}♡ Favorite{% endif %}
        </button>
    </form>
    <a class="recipe-card-link" href="{{ url_for('recipe_detail', recipe_id=recipe.id) }}">
        <div class="recipe-image-placeholder" aria-hidden="true">🥗</div>
        <p class="recipe-type">{{ recipe.meal_type }}</p>
        <h2>{{ recipe.name }}</h2>
        <p class="recipe-meta">{{ recipe.servings }} servings - {{ recipe.calories }} kcal per serving</p>
        <dl class="nutrition">
            <div><dt>Protein</dt><dd>{{ recipe.protein }} g</dd></div>
            <div><dt>Carbs</dt><dd>{{ recipe.carbohydrates }} g</dd></div>
            <div><dt>Fat</dt><dd>{{ recipe.fat }} g</dd></div>
        </dl>
        <p class="tags">
            {% for tag in recipe.tags %}
                <span>{{ tag }}</span>
            {% endfor %}
        </p>
    </a>
</article>
