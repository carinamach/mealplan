{% extends "base.html" %}

{% block title %}Meal Plan | Home{% endblock %}

{% block content %}
    <section class="rounded-[2rem] border border-stone-200 bg-white/90 p-8 shadow-[0_16px_32px_rgba(61,53,69,0.08)] sm:p-10 lg:p-14">
        <p class="mb-3 text-xs font-extrabold uppercase tracking-[0.18em] text-[#b8a9d9]">Welcome</p>
        <h1 class="font-display text-4xl font-semibold tracking-tight text-slate-700 sm:text-5xl">Plan meals with less stress.</h1>
        <p class="mt-4 max-w-2xl text-lg text-slate-500">Your meal-planning app is ready for its first feature.</p>
        <div class="mt-8 flex flex-wrap gap-3">
            <a class="inline-flex items-center justify-center rounded-full bg-[#efa7a0] px-5 py-3 text-sm font-extrabold text-slate-700 no-underline transition hover:bg-[#f5b7ac]" href="{{ url_for('profile') }}">Set up your profile</a>
            <a class="inline-flex items-center justify-center rounded-full bg-[#e8e1f3] px-5 py-3 text-sm font-extrabold text-slate-700 no-underline transition hover:bg-[#d9cceb]" href="{{ url_for('recipes') }}">Browse recipes</a>
        </div>
    </section>
{% endblock %}
